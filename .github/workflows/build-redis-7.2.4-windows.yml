name: Build Redis 7.2.4 on Windows (MSYS2 POSIX)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REDIS_VERSION: 7.2.4

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (MSYS environment)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS  # 使用 MSYS 而非 UCRT64，提供完整 POSIX
          update: true
          install: >-
            gcc
            make
            pkg-config
            openssl-devel
            libopenssl
            tcl
            python
            base-devel
            git

      - name: Download Redis
        run: |
          wget https://github.com/redis/redis/archive/${REDIS_VERSION}.tar.gz
          tar -xzf ${REDIS_VERSION}.tar.gz
          cd redis-${REDIS_VERSION}

      - name: Build
        working-directory: redis-${{ env.REDIS_VERSION }}
        run: |
          # 禁用 SSL 避免 Windows API 问题
          make -j1 MALLOC=libc BUILD_TLS=no

      - name: Package
        working-directory: redis-${{ env.REDIS_VERSION }}
        run: |
          mkdir -p redis-win
          cp src/redis-server redis-win/
          cp src/redis-cli redis-win/
          cp src/redis-benchmark redis-win/
          cp redis.conf sentinel.conf redis-win/
          tar -czf redis-${{ env.REDIS_VERSION }}-msys2.tar.gz redis-win

      - uses: actions/upload-artifact@v4
        with:
          name: redis-msys2
          path: redis-${{ env.REDIS_VERSION }}/redis-${{ env.REDIS_VERSION }}-msys2.tar.gz
